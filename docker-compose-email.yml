services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: dev-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      - MP_MAX_MESSAGES=2000          
      - MP_DATABASE=/data/mailpit.db  
      - MP_SMTP_AUTH=my_api_user:my_api_password  
      - MP_UI_AUTH=my_web_user:my_web_password    
      - MP_SMTP_AUTH_ALLOW_INSECURE=1 

    volumes:
      - mailpit_data:/data

volumes:
  mailpit_data:
