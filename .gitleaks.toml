# Configuración de gitleaks para authorization_api
# Hereda todas las reglas default y agregaallowlists para falsos positivos.
# Docs: https://github.com/gitleaks/gitleaks#configuration
[extend]
useDefault = true

[allowlist]
description = "CI: referencias interpoladas en workflows; demos de curl -u en README historico"
paths = [
  '\.github/workflows/',
  'README\.md',
]
