spring.profiles.active=local
server.port=8080
spring.application.name=authorization_api

spring.datasource.hikari.schema=auth
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=auth
spring.flyway.create-schemas=true

# The issuer must be the externally visible URL of this authorization server.
app.authorization.issuer=${AUTHORIZATION_ISSUER:http://localhost:8080}
app.authorization.cors.allowed-origins=${AUTHORIZATION_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.authorization.key-store.location=${AUTHORIZATION_KEY_STORE:}
app.authorization.key-store.password=${AUTHORIZATION_KEY_STORE_PASSWORD:}
app.authorization.key-store.alias=${AUTHORIZATION_KEY_ALIAS:authorization-server}
app.authorization.key-store.key-password=${AUTHORIZATION_KEY_PASSWORD:}
