spring.profiles.active=local
server.port=8080
spring.application.name=authorization_api

spring.datasource.hikari.schema=auth
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=auth
spring.flyway.create-schemas=true

# The issuer must be the externally visible URL of this authorization server.
app.authorization.issuer=${AUTHORIZATION_ISSUER:http://localhost:8080}
app.authorization.cors.allowed-origins=${AUTHORIZATION_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.authorization.key-store.location=${AUTHORIZATION_KEY_STORE:}
app.authorization.key-store.password=${AUTHORIZATION_KEY_STORE_PASSWORD:}
app.authorization.key-store.alias=${AUTHORIZATION_KEY_ALIAS:authorization-server}
app.authorization.key-store.key-password=${AUTHORIZATION_KEY_PASSWORD:}

# Account lifecycle links are delivered by SMTP and point to the same-origin
# Next.js identity web application.
app.accounts.web-base-url=${ACCOUNT_WEB_BASE_URL:http://localhost:3000}

# Supply once through deployment secrets to create the first infrastructure
# operator. No privileged password is stored in Flyway or application source.
app.bootstrap.infrastructure.username=${INFRASTRUCTURE_BOOTSTRAP_USERNAME:}
app.bootstrap.infrastructure.email=${INFRASTRUCTURE_BOOTSTRAP_EMAIL:}
app.bootstrap.infrastructure.password=${INFRASTRUCTURE_BOOTSTRAP_PASSWORD:}

# Application-level security diagnostics. Spring Security internals remain at
# INFO; enable DEBUG for org.springframework.security only while troubleshooting.
logging.level.com.conecta.authorization_api=DEBUG

# Initial local infrastructure operator. Override these in deployment secrets.
spring.flyway.placeholders.infrastructure_admin_username=${INFRASTRUCTURE_ADMIN_USERNAME:infrastructure}
spring.flyway.placeholders.infrastructure_admin_email=${INFRASTRUCTURE_ADMIN_EMAIL:infrastructure@conecta.local}
spring.flyway.placeholders.infrastructure_admin_password=${INFRASTRUCTURE_ADMIN_PASSWORD:admin1234}
