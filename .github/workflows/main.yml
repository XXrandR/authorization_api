name: SonarCloud Analysis

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: 'Project Key'
        required: true
        default: 'XXrandR_authorization_api'
      organization:
        description: 'Organization Key'
        required: true
        default: 'xxrandr'

jobs:
  sonarcloud:
    name: Build and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build, Test and Generate Coverage
        run: ./gradlew clean test jacocoTestReport

      - name: Generate build timestamp
        id: timestamp
        run: echo "ts=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/qa-sonar@v1.0.0
        with:
          app-name: authorization_api
          project-key: ${{ github.event.inputs.project_key }}
          organization: ${{ github.event.inputs.organization }}
          tek: gradle
          build-timestamp: ${{ steps.timestamp.outputs.ts }}
          sonar-url: ${{ vars.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          java-binaries: build/classes/java/main
          coverage-path: build/reports/jacoco/test/jacocoTestReport.xml

      - name: Print Quality Gate & Coverage Results
        if: always()
        run: |
          echo "=== SonarCloud Project Status ==="
          PROJECT_KEY="${{ github.event.inputs.project_key }}"
          curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" \
            | jq -r '.projectStatus | "Status: " + .status, (.conditions[]? | "- " + .metricKey + ": " + .actualValue|tostring) + " (threshold " + (.errorThreshold|tostring) + ") -> " + .status'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
