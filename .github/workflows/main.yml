name: CI

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: "Project Key"
        required: true
        default: "XXrandR_authorization_api"
      organization:
        description: "Organization Key"
        required: true
        default: "xxrandr"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare (Build, Test & Artifacts)
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.timestamp.outputs.ts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "25"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build, Test and Generate Coverage
        run: ./gradlew clean test jacocoTestReport --no-daemon

      # Genera gradle.lockfile al vuelo (sin ensuciar el repo) para que Trivy
      # pueda auditar todas las dependencias directas y transitivas de Spring/Maven.
      - name: Generate Gradle dependency lockfile for Trivy SCA
        run: |
          INIT_SCRIPT="$(mktemp --suffix=.gradle)"
          cat > "$INIT_SCRIPT" <<'EOF'
          allprojects {
            dependencyLocking {
              lockAllConfigurations()
            }
            tasks.register("resolveAndLockAll") {
              doLast {
                configurations.matching { it.canBeResolved }.all { cfg ->
                  try { cfg.resolve() } catch (Exception ignored) {}
                }
              }
            }
          }
          EOF
          ./gradlew --no-daemon resolveAndLockAll --write-locks -I "$INIT_SCRIPT" >/dev/null || true
          rm -f "$INIT_SCRIPT"

      - name: Generate build timestamp
        id: timestamp
        run: echo "ts=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Upload QA artifacts (classes, tests, JaCoCo coverage & lockfile)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-artifacts-${{ github.run_id }}
          path: |
            settings.gradle
            **/gradle.lockfile
            build/classes/java/main/
            build/reports/jacoco/test/jacocoTestReport.xml
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 1

  gitleaks:
    name: Secrets Scan (Gitleaks)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Historia completa: gitleaks detect escanea todos los commits
          fetch-depth: 0

      - name: Gitleaks
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/qa-gitleaks@0cf27106d2ac24cb8b031e942e3a3bab3a5c10f6 # v1.0.2
        with:
          fail-on-error: "true"

  sql-lint:
    name: SQL Lint (migraciones)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Lint SQL
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/sql-lint@0cf27106d2ac24cb8b031e942e3a3bab3a5c10f6 # v1.0.2
        with:
          sql-paths: src/main/resources/db/migration
          dialect: postgres
          fail-on-error: "true"

  trivy:
    name: Dependency & Security Scan (Trivy)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download QA artifacts (Gradle lockfile)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qa-artifacts-${{ github.run_id }}
          path: .

      - name: Trivy FS Scan
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/qa-trivy@0cf27106d2ac24cb8b031e942e3a3bab3a5c10f6 # v1.0.2
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          fail-on-error: "true"

  sonarcloud:
    name: Code Quality & SAST (SonarCloud)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download QA artifacts (classes, tests & JaCoCo coverage)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qa-artifacts-${{ github.run_id }}
          path: .

      - name: SonarQube Scan
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/qa-sonar@0cf27106d2ac24cb8b031e942e3a3bab3a5c10f6 # v1.0.2
        with:
          app-name: authorization_api
          project-key: ${{ github.event.inputs.project_key }}
          organization: ${{ github.event.inputs.organization }}
          tek: gradle
          build-timestamp: ${{ needs.prepare.outputs.ts }}
          sonar-url: ${{ vars.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          java-binaries: build/classes/java/main
          coverage-path: build/reports/jacoco/test/jacocoTestReport.xml
          coverage-tool: jacoco
          sources: src/main/java

  cleanup:
    name: Cleanup QA Artifacts
    needs: [prepare, gitleaks, sql-lint, trivy, sonarcloud]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete temporary workflow artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="qa-artifacts-${RUN_ID}"
          IDS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .id" || true)
          if [ -z "$IDS" ]; then
            echo "No hay artefactos temporales pendientes por limpiar."
          else
            for id in $IDS; do
              gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}"
              echo "Artefacto temporal eliminado: ${ARTIFACT_NAME} (id=${id})"
            done
          fi
